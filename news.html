    <style>
        :root {
            --primary: #EF4444;
            --dark: #0a0a0a;
            --light: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: #e5e5e5;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        .nav-item,
        .card-title {
            font-family: 'Teko', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(20, 20, 20, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 20, 20, 0.8) 1px, transparent 1px);
            background-size: 50px 50px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #EF4444;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #fff;
        }

        .glass-effect {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
        }

        .clip-path-btn {
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }

        .news-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .news-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
        }

        .news-card img {
            transition: transform 0.6s ease;
        }

        .news-card:hover img {
            transform: scale(1.08);
        }

        .img-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .news-card:hover .img-overlay {
            opacity: 0.3;
        }

        .play-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .news-card:hover .play-icon {
            opacity: 1;
            transform: scale(1);
        }

        #news-grid-container {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .glitch-hover:hover {
            text-shadow: 2px 0 #fff, -2px 0 #EF4444;
            animation: glitch 0.3s linear;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }
    </style>
</head>

        /**
         * Renders news cards with sorting logic (latest first)
         */
        function renderNews(data = newsData) {
            const container = document.getElementById('news-grid-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';

            // Month mapping for date conversion
            const monthsMap = {
                'JAN': 0, 'FEV': 1, 'MAR': 2, 'ABR': 3, 'MAI': 4, 'JUN': 5,
                'JUL': 6, 'AGO': 7, 'SET': 8, 'OUT': 9, 'NOV': 10, 'DEZ': 11
            };

            // Sorting logic: latest dates first
            const sortedData = [...data].sort((a, b) => {
                const partsA = a.date.split(' ');
                const partsB = b.date.split(' ');
                const dateA = new Date(partsA[2], monthsMap[partsA[1]], partsA[0]);
                const dateB = new Date(partsB[2], monthsMap[partsB[1]], partsB[0]);
                return dateB - dateA;
            });

            setTimeout(() => {
                let htmlContent = '';

                if (sortedData.length === 0) {
                    htmlContent = `
                        <div class="col-span-full py-20 text-center flex flex-col items-center">
                            <div class="relative mb-6">
                                <i class="fas fa-exclamation-triangle text-6xl text-red-600 animate-bounce"></i>
                                <i class="fas fa-ghost absolute -top-2 -right-4 text-2xl text-white/20"></i>
                            </div>
                            <h3 class="text-4xl font-bold text-white mb-4 card-title tracking-tighter">Ué, cadê o conteúdo?</h3>
                            <p class="text-gray-400 text-lg max-w-lg mx-auto font-light leading-relaxed">
                                Parece que o conteúdo tomou um <span class="text-red-500 font-bold italic">One Tap</span> ou o MestreJinBruno ficou <span class="text-red-500 font-mono italic">AFK</span> na base. 
                                <br><br>
                                <span class="text-sm bg-zinc-900 px-4 py-2 border border-dashed border-gray-700 rounded-lg">
                                    Status: <span class="text-yellow-500">404 motivos pra voltar.</span>
                                </span>
                            </p>
                            <button onclick="location.reload()" class="mt-8 text-xs text-gray-600 hover:text-red-500 transition-colors uppercase tracking-[0.2em]">
                                Pressionar F5 para tentar dar um respawn
                            </button>
                        </div>
                    `;
                } else {
                    // Substitua o bloco de conteúdo dentro do seu loop por este:
                    sortedData.forEach(item => {
                        const categories = Array.isArray(item.category) ? item.category : [item.category];

                        htmlContent += `
                            <article class="news-card glass-effect border border-gray-800 rounded-xl flex flex-col h-full group">
                                <a href="${item.link}" target="_blank" class="relative block w-full aspect-video overflow-hidden rounded-t-xl cursor-pointer">
                                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/640x360?text=Thumbnail+Not+Found'">
                                    <div class="absolute inset-0 img-overlay"></div>
                                    
                                    <div class="absolute top-3 right-3 flex flex-wrap justify-end gap-1.5 z-20">
                                        ${categories.map(cat => `
                                            <span class="bg-red-600 text-white text-[10px] font-black px-2 py-1 uppercase tracking-tighter rounded-sm shadow-lg border border-red-500/50">
                                                ${cat}
                                            </span>
                                        `).join('')}
                                    </div>

                                    <div class="absolute inset-0 flex items-center justify-center z-30 play-icon">
                                        <div class="w-14 h-14 bg-red-600/90 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(239,68,68,0.6)] backdrop-blur-sm border-2 border-white/50">
                                            <i class="fas fa-play text-white text-lg pl-1"></i>
                                        </div>
                                    </div>
                                </a>
                                <div class="p-6 flex flex-col flex-grow">
                                    <div class="flex items-center gap-2 text-gray-500 text-[11px] font-bold mb-3 tracking-widest">
                                        <i class="far fa-calendar-alt text-red-500"></i>
                                        <span>${item.date}</span>
                                    </div>
                                    <h3 class="text-2xl font-bold text-white mb-3 leading-tight group-hover:text-red-500 transition-colors card-title">
                                        <a href="${item.link}" target="_blank">${item.title}</a>
                                    </h3>
                                    
                                    <div class="flex-grow mb-6">
                                        <p class="text-gray-400 text-sm leading-relaxed font-light border-l-2 border-red-600/40 pl-4" style="max-height: 80px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;">
                                            ${item.description}
                                        </p>
                                    </div>

                                    <a href="${item.link}" target="_blank" class="mt-auto w-full block text-center bg-transparent border border-white/10 hover:border-red-600 hover:bg-red-600 text-white font-bold py-3 uppercase tracking-widest text-xs transition-all duration-500 clip-path-btn">
                                        SAIBA MAIS <i class="fas fa-arrow-right ml-2 text-[10px]"></i>
                                    </a>
                                </div>
                            </article>
                        `;
                    });
                }

                container.innerHTML = htmlContent;
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 300);
        }

        /**
         * Sets up filter button click events
         */
        function setupFilters() {
            const buttons = document.querySelectorAll('.filter-btn');

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.getAttribute('data-category');

                    buttons.forEach(b => {
                        b.classList.remove('bg-red-600', 'text-white');
                        b.classList.add('bg-zinc-900', 'text-gray-300', 'border-gray-700');
                    });
                    btn.classList.add('bg-red-600', 'text-white');
                    btn.classList.remove('bg-zinc-900', 'text-gray-300', 'border-gray-700');

                    if (category === 'all') {
                        renderNews(newsData);
                    } else {
                        const filtered = newsData.filter(item => {
                            const itemCats = Array.isArray(item.category) ? item.category : [item.category];
                            return itemCats.some(cat => cat.toLowerCase() === category.toLowerCase());
                        });
                        renderNews(filtered);
                    }
                });
            });
        }

        // Initialize script on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            renderNews();
            setupFilters();
        });
    </script>
</body>


</html>
